<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTER PERÚ — Recarga</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        :root{--naranja:#FF6B00;--negro:#000;--gris:#1a1a1a;}
        body{background:var(--negro);color:#fff;min-height:100vh;padding:20px;}
        .container{max-width:420px;margin:0 auto;}
        .logo{text-align:center;font-size:26px;font-weight:bold;color:var(--naranja);margin-bottom:20px;}
        .user-id{background:#222;padding:10px;border-radius:8px;margin-bottom:20px;font-size:13px;color:#aaa;}
        .seccion{background:var(--gris);border-radius:12px;padding:18px;margin-bottom:15px;border:1px solid #333;}
        h2{color:var(--naranja);font-size:16px;margin-bottom:12px;text-align:center;}
        .plan{background:#2a2a2a;border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;border:2px solid transparent;}
        .plan:hover,.plan.seleccionado{border-color:var(--naranja);background:#333;}
        .info-pago{display:none;margin-top:15px;background:#222;border-radius:10px;padding:15px;}
        .info-pago.activo{display:block;}
        .qr{width:180px;height:180px;margin:15px auto;display:block;border-radius:8px;background:#333;}
        .dato{background:#333;padding:10px;border-radius:6px;margin:8px 0;font-size:14px;}
        .dato strong{color:var(--naranja);}
        .btn{width:100%;padding:12px;background:var(--naranja);color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:10px;}
        .btn:hover{background:#E65C00;}
        .mensaje{margin-top:12px;padding:10px;border-radius:6px;text-align:center;display:none;}
        .mensaje.ok{background:#1a3a1a;color:#4f4;display:block;}
        .mensaje.error{background:#3a1a1a;color:#f44;display:block;}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚜️ SPECTER PERÚ</div>

        <div class="user-id">Tu ID: <span id="user_id">Abre desde el bot</span></div>

        <div class="seccion">
            <h2>💰 CRÉDITOS</h2>
            <div class="plan" data-monto="10" data-creditos="100">🥉 100 → S/ 10</div>
            <div class="plan" data-monto="20" data-creditos="200">🥈 200 → S/ 20</div>
            <div class="plan" data-monto="30" data-creditos="400">🥇 400 → S/ 30</div>
            <div class="plan" data-monto="50" data-creditos="800">🚀 800 → S/ 50</div>
            <div class="plan" data-monto="100" data-creditos="2000">👑 2,000 → S/ 100</div>
            <div class="plan" data-monto="200" data-creditos="4300">💎 4,300 → S/ 200</div>
        </div>

        <div class="info-pago" id="info_pago">
            <h2>💳 PAGAR</h2>
            <img class="qr" src="https://files.catbox.moe/1037r1.jpg" alt="QR Yape">
            
            <div class="dato">
                <strong>📱 Yape:</strong><br>  925805734 | Christian Gustavo
Ramos Gonzales
            </div>
            <div class="dato">
                <strong>🏦 CCI:</strong><br>0021234567890987654321
            </div>
            <div class="dato">
                <strong>💰 Monto:</strong><br><span id="monto" style="font-size:20px;color:#FF6B00;font-weight:bold;">S/ 0.00</span>
            </div>

            <button class="btn" id="btn_confirmar" onclick="confirmarRecarga()">✅ YA PAGUÉ — SUMAR CRÉDITOS</button>
            <div class="mensaje" id="mensaje"></div>
        </div>
    </div>

    <script>
        let user_id = "";
        let montoSeleccionado = 0;
        let BOT_USERNAME = "specter_Dox44bot"; // Sin el @

        window.onload = function(){
            const params = new URLSearchParams(window.location.search);
            user_id = params.get("user_id") || "";
            document.getElementById("user_id").textContent = user_id || "Abre desde /web en el bot";
        };

        document.querySelectorAll(".plan").forEach(p => {
            p.addEventListener("click", function(){
                document.querySelectorAll(".plan").forEach(x => x.classList.remove("seleccionado"));
                this.classList.add("seleccionado");
                montoSeleccionado = parseFloat(this.dataset.monto);
                document.getElementById("info_pago").classList.add("activo");
                document.getElementById("monto").textContent = "S/ " + montoSeleccionado + ".00";
                document.getElementById("info_pago").scrollIntoView({behavior:"smooth"});
            });
        });

        function confirmarRecarga(){
            if(!user_id || !montoSeleccionado){
                mostrarMensaje("❌ Abre desde el bot con /web", "error");
                return;
            }

            // Abre el chat con el bot y ejecuta el comando de recarga
            const comando = `/recarga_web ${user_id} ${montoSeleccionado}`;
            const urlTelegram = `https://t.me/${BOT_USERNAME}?start=${encodeURIComponent(comando)}`;
            
            // Abre Telegram en nueva pestaña
            window.open(urlTelegram, "_blank");
            
            mostrarMensaje("✅ Se abrió Telegram. Revisa tu bot — ¡créditos sumados!", "ok");
        }

        function mostrarMensaje(texto, tipo){
            const msg = document.getElementById("mensaje");
            msg.textContent = texto;
            msg.className = "mensaje " + tipo;
        }
    </script>
</body>
</html>
